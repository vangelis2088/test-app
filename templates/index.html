<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vote for the next talk</title>
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true},{"code":"...","swap":true}]}'>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 1rem auto 2rem; padding: 0 1rem; }
    h1 { font-size: clamp(1.5rem, 6vw, 2rem); margin: .5rem 0 1rem; }
    form { display: grid; gap: .75rem; margin-bottom: 1.5rem; }
    label { display: grid; gap: .25rem; font-weight: 500; }
    input, button { font: inherit; padding: .5rem; }
    input { width: 100%; min-height: 44px; }
    form button { min-height: 44px; }
    .topics { list-style: none; padding: 0; margin: 0; }
    .topic { display: flex; gap: .75rem; align-items: flex-start; padding: .75rem .5rem; border-bottom: 1px solid #ddd; }
    .topic.voted { background: #e8f5e9; box-shadow: inset 4px 0 0 #2e7d32; }
    .vote { display: flex; flex-direction: column; align-items: center; gap: .25rem; flex: 0 0 4.75rem; }
    .count { font-weight: bold; font-size: 1.2rem; line-height: 1; }
    .vote button { width: 100%; min-height: 44px; font-size: .9rem; padding: .25rem; }
    .vote button:disabled { background: #c8e6c9; color: #1b5e20; border: 1px solid #2e7d32; font-weight: 600; opacity: 1; }
    .body { flex: 1; min-width: 0; overflow-wrap: anywhere; padding-top: .15rem; }
    .badge { background: #ffd54f; border-radius: 4px; padding: 0 .4rem; font-size: .8rem; margin-left: .3rem; white-space: nowrap; }
    .author { display: block; color: #666; font-size: .9rem; margin-top: .2rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Vote for the next talk</h1>

  <form hx-post="/topics" hx-target="#topics" hx-swap="innerHTML"
        hx-on::after-request="if (event.detail.xhr.status === 200) this.reset()">
    <label>Topic <input name="title" required maxlength="280"></label>
    <label>Your name (optional) <input name="author"></label>
    <button type="submit">Suggest topic</button>
  </form>

  <div id="topics" hx-get="/topics" hx-trigger="every 3s" hx-swap="innerHTML">
    {% include "_topics.html" %}
  </div>
</body>
</html>
