<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "422", "swap": true}, {"code": "[45]..", "swap": false, "error": true}]}'>
  <title>Vote for the Next Talk</title>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    form { display: grid; gap: 0.5rem; margin-bottom: 2rem; }
    input, button { font: inherit; padding: 0.5rem; }
    #form-error { color: #b00020; min-height: 1.2em; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; padding: 0.75rem; border-bottom: 1px solid #ddd; }
    /* Inset shadow instead of a border so the highlighted row's text stays aligned. */
    li.voted { background: #e8f4ff; box-shadow: inset 4px 0 0 #1a73e8; }
    /* min-width: 0 lets the text column shrink; overflow-wrap breaks long URLs/words. */
    .topic-body { min-width: 0; overflow-wrap: anywhere; }
    .vote { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
    .vote-count { font-weight: bold; min-width: 2ch; text-align: right; }
    /* 44px minimum touch target; fixed width so "Vote"/"Your vote" don't shift the row. */
    .vote button { min-height: 44px; min-width: 6.5rem; border-radius: 0.25rem; }
    li.voted button { background: #1a73e8; color: #fff; border: 1px solid #1a73e8; }
    .author { color: #666; font-size: 0.9em; }
    .badge { display: inline-block; white-space: nowrap; background: #ffe08a; border-radius: 0.25rem; padding: 0.1rem 0.4rem; font-size: 0.8em; margin-left: 0.4rem; }
  </style>
</head>
<body>
  <h1>Vote for the Next Talk</h1>

  <form hx-post="/topics" hx-target="#topics" hx-swap="innerHTML"
        hx-on::after-request="if (event.detail.successful) { this.reset(); document.getElementById('form-error').innerHTML = ''; }">
    <label for="title">Suggest a topic</label>
    <input id="title" name="title" required maxlength="{{ max_title_length }}" autocomplete="off">
    <label for="author">Your name (optional)</label>
    <input id="author" name="author" autocomplete="name">
    <div id="form-error" role="alert"></div>
    <button type="submit">Suggest</button>
  </form>

  <h2>Topics</h2>
  <div id="topics" hx-get="/topics" hx-trigger="every 3s" hx-swap="innerHTML">
    {% include "_topics.html" %}
  </div>
</body>
</html>
