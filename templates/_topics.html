{% if topics %}
<ul>
  {% for topic in topics %}
  <li>
    <div>{{ topic.title }}</div>
    <div class="meta">
      {% if topic.source == "organizer" %}<span class="badge">Organizer's pick</span>{% else %}{{ topic.author or "Anonymous" }}{% endif %}
    </div>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>No topics yet. Suggest the first one!</p>
{% endif %}
